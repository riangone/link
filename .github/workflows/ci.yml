name: CI

# No build/bundle step by design: server/ and client/ are run/served as
# plain Node / vanilla JS. This workflow only lints (syntax-checks) and
# tests what already exists.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server-unit-tests:
    name: Server unit tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run server unit tests
        working-directory: server
        run: npm test

  client-syntax-check:
    name: Client syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --check every client script
        run: |
          set -e
          for f in client/scripts/*.js client/service-worker.js; do
            echo "Checking $f"
            node --check "$f"
          done

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [server-unit-tests, client-syntax-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root (Playwright) dependencies
        run: npm ci
      - name: Install server dependencies (dev-server attaches the real signaling server)
        working-directory: server
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
