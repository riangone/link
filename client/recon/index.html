<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>钢影：侦察战</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <header>
        <b class="logo">LINK <span>// RECON</span></b>
        <span class="score" id="score">0 : 0</span>
        <select id="lang" aria-label="Language">
            <option value="zh">中文</option><option value="en">EN</option><option value="ja">日本語</option><option value="ko">한국어</option>
        </select>
    </header>

    <section class="field" id="field">
        <canvas id="game"></canvas>

        <div class="touch" id="touch">
            <div class="stick" id="stick"><div class="knob" id="knob"></div><span data-i18n="stick"></span></div>
            <div class="acts">
                <button type="button" class="act" id="drone-btn">🛸<small data-i18n="drone"></small><i class="cd"></i></button>
                <button type="button" class="act" id="sat-btn">🛰️<small data-i18n="sat"></small><i class="cd"></i></button>
                <button type="button" class="act fire" id="fire-btn">💥<small data-i18n="fire"></small></button>
            </div>
        </div>

        <div class="overlay" id="overlay">
            <div class="card" id="lobby-screen">
                <h1 data-i18n="title"></h1>
                <p data-i18n="tagline"></p>
                <label class="invite"><span data-i18n="invite"></span>
                    <span class="row"><input id="invite-url" readonly><button type="button" id="copy-btn" data-i18n="copy"></button></span>
                </label>
                <p class="muted" id="conn-text" data-i18n="conn_wait"></p>
            </div>
            <div class="card hidden" id="ready-screen">
                <h1 data-i18n="title"></h1>
                <h2 data-i18n="ready_h"></h2>
                <p id="role-text"></p>
                <p class="muted" data-i18n="rule" data-n="3"></p>
                <button type="button" class="primary" id="start-btn" data-i18n="start"></button>
            </div>
            <div class="card hidden" id="gameover-screen">
                <h1 id="result-title"></h1>
                <p><span data-i18n="final"></span>: <b id="final-score">0 - 0</b></p>
                <button type="button" class="primary" id="restart-btn" data-i18n="rematch"></button>
            </div>
            <div class="card hidden" id="disconnect-screen">
                <h1 data-i18n="lost_h"></h1>
                <p data-i18n="lost_p"></p>
                <button type="button" class="primary" id="reload-btn" data-i18n="reload"></button>
            </div>
            <a class="back" href="../play/" data-i18n="lobby"></a>
        </div>
    </section>

    <aside class="help">
        <span data-i18n="h_move"></span><span data-i18n="h_aim"></span><span data-i18n="h_drone"></span>
        <span data-i18n="h_sat"></span><span data-i18n="h_forest"></span><span data-i18n="h_ruin"></span>
    </aside>
    <p class="status"><span id="status-text">--</span> · <span id="ping-text">-- ms</span> · <span id="role-status-text">--</span></p>
</main>
<script src="../scripts/game-session.js"></script>
<script src="../scripts/game-bot.js" data-lobby="../play/"></script>
<script src="i18n.js"></script>
<script src="game.js"></script>
</body>
</html>
